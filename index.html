<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Benim Sesim">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Benim Sesim</title>
<style>
:root{--bg:#f4f7f6;--ink:#2b3a42;--line:#dfe6e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
header .ttl{flex:1;display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;min-width:0}
header .ttl .emo{font-size:30px}
header .ttl .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
header .ttl span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:0;background:#eef3f2;border-radius:16px;min-width:52px;height:52px;font-size:26px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0 12px}
.hb.lang{font-size:15px}
.hb:active{transform:scale(.96)}
#ribbon{display:none;background:#ffb74d;color:#3b2a00;text-align:center;font-weight:700;padding:6px;font-size:14px}
#main{padding:14px 12px 130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.home .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;background:#fff;border:5px solid var(--c,#9ab);border-radius:24px;aspect-ratio:1/1.08;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card.wide{grid-column:span 2;aspect-ratio:2.16/1.08}
.card:active{transform:scale(.97)}
.card.on{transform:scale(1.04);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent)}
.pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.emo{font-size:clamp(54px,16vw,84px);line-height:1}
.home .emo{font-size:clamp(60px,18vw,92px)}
.lbl{background:color-mix(in srgb,var(--c) 14%,#fff);text-align:center;font-weight:800;font-size:19px;padding:7px 4px;line-height:1.2}
.lbl .sec{font-weight:600;font-size:16px;opacity:.75}
.home .lbl{font-size:21px}
.scene{display:flex;align-items:center;justify-content:center;gap:2%;width:100%;height:100%}
.scene svg{width:46%;height:auto;max-height:100%}
.scene .emo{font-size:clamp(40px,12vw,64px)}
.dot{width:72%;aspect-ratio:1;max-width:96px;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.letter{display:flex;flex-direction:column;align-items:center;gap:2px}
.letter b{font-size:clamp(40px,12vw,58px);line-height:1;color:#244}
.letter .emo{font-size:clamp(36px,11vw,52px)}
.num{display:flex;flex-direction:column;align-items:center;gap:2px}
.num b{font-size:clamp(46px,14vw,66px);line-height:1;color:#244}
.num .dots{font-size:clamp(17px,5vw,24px);line-height:1.15;text-align:center;max-width:90%;word-break:break-all}
.pen{position:absolute;top:4px;right:6px;font-style:normal;font-size:18px;background:#fff;border-radius:50%;padding:2px 4px;z-index:2}
.card.add{border-style:dashed;--c:#8a98a0;background:#fafcfc}
.card.add .emo{font-size:60px;color:#8a98a0}
.hint{grid-column:1/-1;background:#fff;border:3px dashed #c3ced3;border-radius:20px;padding:16px;font-size:17px;line-height:1.5}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:3px solid var(--line);display:none;align-items:center;gap:12px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));min-height:84px}
#bar .bp{width:84px;height:70px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bar .bp .emo{font-size:46px}
#bar .bp .scene svg{width:40px}
#bar .bp .dot{width:46px}
#bar .bp .letter b{font-size:30px}
#bar .bp .letter .emo{font-size:26px}
#bar .bp .num b{font-size:34px}#bar .bp .num .dots{display:none}
#bar .bt{flex:1;font-size:22px;font-weight:800;line-height:1.2}
#bar .bt .sec{font-size:16px;font-weight:600;opacity:.7}
#bar button{width:72px;height:72px;border-radius:50%;border:0;background:#3fb68b;color:#fff;font-size:34px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,40,45,.55);display:flex;align-items:flex-end;justify-content:center}
.box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px 28px;user-select:text}
.box h2{margin:0 0 10px;font-size:22px}.box h3{margin:16px 0 6px;font-size:16px;color:#5b6b73}
.box label{display:block;font-size:14px;font-weight:700;margin:10px 0 0;color:#4a5a62}
.box input[type=text],.box input:not([type]){width:100%;font-size:18px;padding:11px;border:2px solid var(--line);border-radius:12px;margin-top:4px;user-select:text}
.box .chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;padding:8px 0}
.box .chk input{width:22px;height:22px}
.box button,.box .btn{font-size:17px;font-weight:700;border:0;border-radius:14px;padding:13px 16px;background:#e8efee;color:var(--ink);margin:6px 6px 0 0;display:inline-block;cursor:pointer}
.box button.pri{background:#3fb68b;color:#fff}.box button.dng{background:#ffd9d6;color:#a3261d}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.sel{background:#3fb68b;color:#fff}
.box input[type=range]{width:100%}
.prev{height:140px;border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden}
.prev img{max-width:100%;max-height:100%}
.small{font-size:14px;color:#5b6b73;line-height:1.5}
#player{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
#player .pb{display:flex;justify-content:flex-start;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}
#player .pb button{width:68px;height:68px;border-radius:50%;border:0;background:#fff;font-size:32px}
#player iframe{flex:1;border:0;width:100%}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b3a42;color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;z-index:40;display:none;max-width:88%;text-align:center}
</style>
</head>
<body>
<header>
  <button class="hb" id="homeBtn" aria-label="Ana sayfa">🏠</button>
  <div class="ttl" id="ttl"></div>
  <button class="hb lang" id="langBtn"></button>
  <button class="hb" id="gearBtn" aria-label="Ebeveyn paneli">⚙️</button>

<div id="bar"><div class="bp" id="barPic"></div><div class="bt" id="barTxt"></div><button id="barPlay" aria-label="Tekrar söyle">▶</button></div>
<div id="player"><div class="pb"><button id="pClose" aria-label="Kapat">✕</button></div><iframe id="pFrame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe></div>

const KEY='benim_sesim_v1';
let S={lang:'tr',rate:0.8,text:true,hidden:[],ov:{},custom:[],videos:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let view='home',last=null,edit=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kaydedilemedi: hafıza dolmuş olabilir (çok fazla fotoğraf)')}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}

/* ---------- seslendirme ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(l){const v=voices.filter(x=>x.lang.toLowerCase().replace('_','-').startsWith(l));return v.find(x=>x.localService)||v[0]||null}
const pick=(sv,lab)=>sv===false?'':(sv||lab||'');
function spoken(c){
  const L=S.lang,out=[];
  if(L!=='de'){const t=pick(c.s&&c.s[0],c.tr);if(t)out.push({l:'tr',t})}
  if(L!=='tr'){const t=pick(c.s&&c.s[1],c.de);if(t)out.push({l:'de',t})}
  if(!out.length){const t=c.tr||c.de;if(t)out.push({l:c.tr?'tr':'de',t})}
  return out;
}
function speakParts(parts){
  if(!('speechSynthesis' in window)){toast('Bu cihaz sesli okumayı desteklemiyor');return}
  try{speechSynthesis.cancel()}catch(e){}
  parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p.t);u.lang=p.l==='tr'?'tr-TR':'de-DE';const v=pickVoice(p.l);if(v)u.voice=v;u.rate=S.rate;u.pitch=1.05;speechSynthesis.speak(u)});
}

/* ---------- kartlar ---------- */
function picHtml(c){
  if(c.img)return `<img src="${c.img}" alt="">`;
  const p=c.pic||'🖼️';return p.charAt(0)==='<'?p:`<span class="emo">${p}</span>`;
}
function labelHtml(c){
  const L=S.lang;let o='';
  if(L!=='de'&&c.tr)o+=`<div>${esc(c.tr)}</div>`;
  if(L!=='tr'&&c.de)o+=`<div class="${L==='both'&&c.tr?'sec':''}">${esc(c.de)}</div>`;
  if(!o)o=`<div>${esc(c.tr||c.de||'')}</div>`;
  return o;
}
function cardsOf(cat){
  let base=typeof cat.cards==='function'?cat.cards():cat.cards.slice();
  base=base.map(c=>{const o=S.ov[c.id];if(!o)return c;const m={...c};if(o.img)m.img=o.img;if(o.tr!==undefined)m.tr=o.tr;if(o.de!==undefined)m.de=o.de;if(o.s)m.s=o.s;return m});
  const cu=S.custom.filter(x=>x.cat===cat.id).map(x=>({...x,custom:1}));
  return base.concat(cu);
}
function cardEl(c,i,col,k='card'){
  return `<div class="card${c.wide?' wide':''}" data-k="${k}" data-i="${i}" style="--c:${col}">${edit&&k==='card'?'<i class="pen">✏️</i>':''}<div class="pic">${picHtml(c)}</div>${S.text||edit?`<div class="lbl">${labelHtml(c)}</div>`:''}</div>`;
}
function catVisible(){return CATS.filter(c=>!S.hidden.includes(c.id))}

/* ---------- ekranlar ---------- */
function render(){
  $('#ribbon').style.display=edit?'block':'none';
  $('#langBtn').textContent=S.lang==='tr'?'🇹🇷 TR':S.lang==='de'?'🇩🇪 DE':'🇹🇷🇩🇪';
  const m=$('#main');
  $('#homeBtn').style.visibility=view==='home'?'hidden':'visible';
  if(view==='home'){
    $('#ttl').innerHTML='<img class="logo" src="'+LOGO+'" alt=""><span class="t">Benim Sesim</span>';
    const cs=catVisible();
    m.className='home';
    m.innerHTML=`<div class="grid">${cs.map((c,i)=>cardEl({pic:c.pic,tr:c.tr,de:c.de},i,c.col,'cat')).join('')}</div>`;
    $('#bar').style.display='none';
    return;
  }
  const cat=CATS.find(c=>c.id===view);
  const nm=S.lang==='de'?cat.de:cat.tr;
  $('#ttl').innerHTML=`<span class="emo">${cat.pic.charAt(0)==='<'?'':cat.pic}</span><span class="t">${esc(nm)}</span>`;
  m.className='';
  if(cat.video){renderVideos(cat);return}
  const cs=cardsOf(cat);
  let h=cs.map((c,i)=>cardEl(c,i,cat.col)).join('');
  if(edit)h+=`<div class="card add" data-k="add"><div class="pic"><span class="emo">➕</span></div><div class="lbl">Kart ekle</div></div>`;
  if(!cs.length&&!edit)h=`<div class="hint">Burası henüz boş.<br>⚙️ düğmesine <b>basılı tutun</b> → <b>Düzenleme modu</b> → <b>➕ Kart ekle</b>.<br>Kendi fotoğraflarınızla (örn. kendi tabağı, kendi oyuncağı) kart yapabilirsiniz.</div>`;
  m.innerHTML=`<div class="grid">${h}</div>`;
  if(last)showBar(last);else $('#bar').style.display='none';
}
function videoThumb(v){return v.id?`<img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" onerror="this.outerHTML='<span class=emo>🎬</span>'">`:'<span class="emo">🎬</span>'}
function renderVideos(cat){
  let h=S.videos.map((v,i)=>`<div class="card wide" data-k="vid" data-i="${i}" style="--c:${cat.col}">${edit?'<i class="pen">✏️</i>':''}<div class="pic">${videoThumb(v)}<div style="position:absolute;font-size:54px;opacity:.9">▶️</div></div><div class="lbl">${esc(v.t||'Video')}</div></div>`).join('');
  if(edit)h+=`<div class="card add" data-k="vadd"><div class="pic"><span class="emo">➕</span></div><div class="lbl">Video ekle</div></div>`;
  if(!S.videos.length)h=`<div class="hint">Henüz video yok.<br>⚙️ düğmesine <b>basılı tutun</b> → <b>Düzenleme modu</b> → <b>➕ Video ekle</b>.<br>YouTube'dan şarkı/eğitici film bağlantısını kopyalayıp yapıştırın. Videolar için internet gerekir.</div>`+(edit?'':'' )+h;
  if(edit)h+=`<div class="hint">YouTube'da aramak için (ebeveyn):<br><button class="hb" style="display:inline-flex;margin:6px 6px 0 0" onclick="window.open('https://www.youtube.com/results?search_query=Niloya','_blank')">🔎 Niloya</button><button class="hb" style="display:inline-flex;margin:6px 6px 0 0" onclick="window.open('https://www.youtube.com/results?search_query=çocuk+şarkıları+eğitici','_blank')">🔎 Çocuk şarkıları</button><button class="hb" style="display:inline-flex;margin:6px 0 0" onclick="window.open('https://www.youtube.com/results?search_query=Kinderlieder+zum+Lernen','_blank')">🔎 Kinderlieder</button></div>`;
  $('#main').innerHTML=`<div class="grid">${h}</div>`;
  $('#bar').style.display='none';
}
function showBar(c){
  $('#bar').style.display='flex';
  $('#barPic').innerHTML=picHtml(c);
  $('#barTxt').innerHTML=labelHtml(c);
}

/* ---------- gezinme ---------- */
function go(id){view=id;last=null;history.pushState({v:id},'');render();window.scrollTo(0,0)}
function home(){if(history.state&&history.state.v){history.back()}else{view='home';last=null;render()}}
window.addEventListener('popstate',e=>{view=(e.state&&e.state.v)||'home';last=null;render()});
history.replaceState({},'');
$('#homeBtn').onclick=home;
$('#langBtn').onclick=()=>{S.lang=S.lang==='tr'?'de':S.lang==='de'?'both':'tr';save();render();toast(S.lang==='tr'?'Türkçe':S.lang==='de'?'Deutsch':'Türkçe + Deutsch')};
$('#barPlay').onclick=()=>{if(last)speakParts(spoken(last))};

$('#main').addEventListener('click',e=>{
  const el=e.target.closest('.card');if(!el)return;
  const k=el.dataset.k,i=+el.dataset.i;
  if(k==='cat'){const c=catVisible()[i];speakParts(spoken({tr:c.tr,de:c.de}));go(c.id);return}
  if(k==='add'){openEditor(CATS.find(c=>c.id===view),null);return}
  if(k==='vadd'){openVideoEditor(-1);return}
  if(k==='vid'){edit?openVideoEditor(i):playVideo(S.videos[i]);return}
  const cat=CATS.find(c=>c.id===view),c=cardsOf(cat)[i];
  if(edit){openEditor(cat,c);return}
  last=c;showBar(c);speakParts(spoken(c));
  el.classList.add('on');setTimeout(()=>el.classList.remove('on'),450);
});

/* ---------- video ---------- */
function parseYT(u){
  u=(u||'').trim();let m;
  if((m=u.match(/[?&]v=([\w-]{11})/)))return {id:m[1]};
  if((m=u.match(/youtu\.be\/([\w-]{11})/)))return {id:m[1]};
  if((m=u.match(/\/(?:shorts|embed|live)\/([\w-]{11})/)))return {id:m[1]};
  if((m=u.match(/[?&]list=([\w-]+)/)))return {list:m[1]};
  if(/^[\w-]{11}$/.test(u))return {id:u};
  return null;
}
function playVideo(v){
  const src=v.id?`https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1`:`https://www.youtube-nocookie.com/embed/videoseries?list=${v.list}&autoplay=1&rel=0&playsinline=1`;
  try{speechSynthesis.cancel()}catch(e){}
  $('#pFrame').src=src;$('#player').style.display='flex';
}
$('#pClose').onclick=()=>{$('#pFrame').src='about:blank';$('#player').style.display='none'};
function openVideoEditor(i){
  const v=i>=0?S.videos[i]:null;
  const o=modal(`<h2>${v?'Videoyu düzenle':'Video ekle'}</h2>
   <label>YouTube bağlantısı (video veya oynatma listesi)<input id="vUrl" value="${v?esc(v.url||''):''}" placeholder="https://www.youtube.com/watch?v=..."></label>
   <label>Başlık (isteğe bağlı)<input id="vTit" value="${v?esc(v.t||''):''}"></label>
   <p class="small">Not: Videolar internetten oynatılır. Bağlantıyı YouTube uygulamasında “Paylaş → Bağlantıyı kopyala” ile alabilirsiniz.</p>
   <button class="pri" id="vSave">Kaydet</button>${v?'<button class="dng" id="vDel">Sil</button>':''}<button id="vCan">Vazgeç</button>`);
  o.querySelector('#vCan').onclick=o.close;
  o.querySelector('#vSave').onclick=()=>{
    const url=o.querySelector('#vUrl').value,p=parseYT(url);
    if(!p){toast('Bağlantı anlaşılamadı');return}
    const item={...p,url,t:o.querySelector('#vTit').value.trim()};
    if(v)S.videos[i]=item;else S.videos.push(item);
    save();o.close();render();
  };
  if(v)o.querySelector('#vDel').onclick=()=>{S.videos.splice(i,1);save();o.close();render()};
}

/* ---------- kart düzenleyici ---------- */
function modal(html){
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="box">${html}</div>`;
  document.body.appendChild(o);o.close=()=>o.remove();
  o.addEventListener('click',e=>{if(e.target===o)o.close()});return o;
}
function readImg(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=380,sc=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.82))};im.src=r.result};
  r.readAsDataURL(file);
}
function openEditor(cat,c){
  const isNew=!c,textOk=!['letters','numbers','colors'].includes(cat.id);
  let img=c&&c.img?c.img:'';
  const sv=c&&c.s?c.s:[];
  const o=modal(`<h2>${isNew?'Yeni kart':'Kartı düzenle'}</h2>
   <div class="prev" id="ePrev"></div>
   <label class="btn" style="margin:0">📷 Fotoğraf çek / resim seç<input type="file" accept="image/*" id="eFile" hidden></label>
   ${textOk?`<label>Türkçe ad<input id="eTr" value="${esc(c?c.tr:'')}"></label>
   <label>Almanca ad<input id="eDe" value="${esc(c?c.de:'')}"></label>
   <label>Türkçe söylenecek cümle (boşsa ad söylenir)<input id="eSt" value="${esc(sv[0]||'')}" placeholder="örn. Nutellalı ekmek istiyorum."></label>
   <label>Almanca söylenecek cümle (boşsa ad söylenir)<input id="eSd" value="${esc(sv[1]||'')}" placeholder="z.B. Ich möchte Brot mit Nutella."></label>`:''}
   <div style="margin-top:14px"><button class="pri" id="eSave">Kaydet</button>${!isNew&&(c.custom||S.ov[c.id])?`<button class="dng" id="eDel">${c.custom?'Kartı sil':'Orijinale dön'}</button>`:''}<button id="eCan">Vazgeç</button></div>`);
  const prev=()=>{o.querySelector('#ePrev').innerHTML=img?`<img src="${img}">`:(c?picHtml(c):'<span class="small">Resim seçilmedi</span>')};prev();
  o.querySelector('#eFile').onchange=e=>{const f=e.target.files[0];if(f)readImg(f,d=>{img=d;prev()})};
  o.querySelector('#eCan').onclick=o.close;
  o.querySelector('#eSave').onclick=()=>{
    const g=id=>o.querySelector(id)?o.querySelector(id).value.trim():'';
    const tr=g('#eTr'),de=g('#eDe'),s=[g('#eSt')||null,g('#eSd')||null];
    if(isNew){
      if(!img&&!tr&&!de){toast('Resim veya ad girin');return}
      S.custom.push({id:'c'+Date.now(),cat:cat.id,tr,de,s,img});
    }else if(c.custom){
      const x=S.custom.find(z=>z.id===c.id);Object.assign(x,{tr,de,s,img});
    }else{
      const ov=S.ov[c.id]||{};if(img)ov.img=img;if(textOk){ov.tr=tr;ov.de=de;ov.s=s}S.ov[c.id]=ov;
    }
    save();o.close();render();
  };
  const d=o.querySelector('#eDel');
  if(d)d.onclick=()=>{if(c.custom)S.custom=S.custom.filter(z=>z.id!==c.id);else delete S.ov[c.id];save();o.close();render()};
}

/* ---------- ebeveyn paneli ---------- */
function openSettings(){
  const vs=l=>pickVoice(l)?`✅ ${l==='tr'?'Türkçe':'Almanca'} ses bulundu`:`⚠️ ${l==='tr'?'Türkçe':'Almanca'} ses bulunamadı`;
  const o=modal(`<h2>👨‍👧 Ebeveyn paneli</h2>
   <h3>Konuşma dili</h3>
   <div class="seg" id="sLang"><button data-v="tr">Türkçe</button><button data-v="de">Deutsch</button><button data-v="both">Türkçe + Deutsch</button></div>
   <h3>Konuşma hızı</h3><input type="range" id="sRate" min="0.5" max="1.2" step="0.05" value="${S.rate}">
   <label class="chk"><input type="checkbox" id="sText" ${S.text?'checked':''}> Kartların altında yazıyı göster</label>
   <label class="chk"><input type="checkbox" id="sEdit" ${edit?'checked':''}> Düzenleme modu (kart, resim, video ekle/değiştir)</label>
   <h3>Görünen bölümler</h3>
   ${CATS.map(c=>`<label class="chk"><input type="checkbox" data-cat="${c.id}" ${S.hidden.includes(c.id)?'':'checked'}> ${c.tr}</label>`).join('')}
   <h3>Ses testi</h3>
   <button id="tTr">▶ Türkçe dene</button><button id="tDe">▶ Deutsch testen</button>
   <p class="small">${vs('tr')}<br>${vs('de')}<br>Ses yoksa: telefon ayarları → Dil ve giriş → Metin okuma (Text-to-speech) bölümünden Türkçe ve Almanca sesleri indirin.</p>
   <h3>Yedek</h3>
   <button id="bExp">⬇ Yedeği indir</button><label class="btn" style="margin:6px 6px 0 0">⬆ Yedeği yükle<input type="file" accept=".json,application/json" id="bImp" hidden></label>
   <p class="small">Fotoğraflar ve kartlar bu cihazın tarayıcı hafızasında durur. Telefon değiştirirken yedeği alın.</p>
   <div style="margin-top:14px"><button class="pri" id="sOk">Tamam</button></div>`);
  const sync=()=>o.querySelectorAll('#sLang button').forEach(b=>b.classList.toggle('sel',b.dataset.v===S.lang));sync();
  o.querySelectorAll('#sLang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.v;save();sync()});
  o.querySelector('#sRate').oninput=e=>{S.rate=+e.target.value;save()};
  o.querySelector('#sText').onchange=e=>{S.text=e.target.checked;save()};
  o.querySelector('#sEdit').onchange=e=>{edit=e.target.checked};
  o.querySelectorAll('[data-cat]').forEach(b=>b.onchange=()=>{const id=b.dataset.cat;S.hidden=S.hidden.filter(x=>x!==id);if(!b.checked)S.hidden.push(id);save()});
  o.querySelector('#tTr').onclick=()=>speakParts([{l:'tr',t:'Merhaba! Ben senin sesinim.'}]);
  o.querySelector('#tDe').onclick=()=>speakParts([{l:'de',t:'Hallo! Ich bin deine Stimme.'}]);
  o.querySelector('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='benim-sesim-yedek.json';a.click()};
  o.querySelector('#bImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();o.close();render();toast('Yedek yüklendi')}catch(x){toast('Dosya okunamadı')}};r.readAsText(f)};
  o.querySelector('#sOk').onclick=()=>{o.close();render()};
}
let hold;
const gear=$('#gearBtn');
gear.addEventListener('pointerdown',()=>{hold=setTimeout(()=>{hold=null;openSettings()},1200)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,()=>{if(hold){clearTimeout(hold);hold=null;if(ev==='pointerup')toast('Ebeveyn paneli için ⚙️ düğmesine 1-2 saniye basılı tutun')}}));
gear.addEventListener('contextmenu',e=>e.preventDefault());
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
